<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Subscription</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 320px;
            background: #222;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .display {
            width: 100%;
            height: 70px;
            box-sizing: border-box;
            font-size: 30px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 10px;
            background: white;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
        }

        .number {
            background: #444;
            color: white;
        }

        .operator {
            background: #ff9500;
            color: white;
        }

        .clear {
            background: #d9534f;
            color: white;
        }

        .equal {
            background: #28a745;
            color: white;
        }

        /* Subscription Page */
        .subscription {
            display: none;
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .subscription h1 {
            color: #222;
        }

        .subscription p {
            color: #666;
        }

        .plan {
            background: #f5f5f5;
            padding: 20px;
            margin: 15px 0;
            border-radius: 15px;
        }

        .plan h2 {
            margin: 5px;
        }

        .subscribe-btn {
            width: 100%;
            background: #ff9500;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }

        .back-btn {
            margin-top: 15px;
            background: #ddd;
            width: 100%;
        }

        #answer {
            margin-top: 20px;
            font-size: 25px;
            font-weight: bold;
            color: #28a745;
        }
    </style>
</head>

<body>

    <!-- CALCULATOR -->
    <div class="calculator" id="calculator">

        <input type="text" class="display" id="display" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="addToDisplay('/')">÷</button>
            <button class="operator" onclick="addToDisplay('*')">×</button>
            <button class="operator" onclick="addToDisplay('-')">−</button>

            <button class="number" onclick="addToDisplay('7')">7</button>
            <button class="number" onclick="addToDisplay('8')">8</button>
            <button class="number" onclick="addToDisplay('9')">9</button>
            <button class="operator" onclick="addToDisplay('+')">+</button>

            <button class="number" onclick="addToDisplay('4')">4</button>
            <button class="number" onclick="addToDisplay('5')">5</button>
            <button class="number" onclick="addToDisplay('6')">6</button>
            <button class="number" onclick="addToDisplay('.')">.</button>

            <button class="number" onclick="addToDisplay('1')">1</button>
            <button class="number" onclick="addToDisplay('2')">2</button>
            <button class="number" onclick="addToDisplay('3')">3</button>

            <button class="equal" onclick="showSubscription()">=</button>

            <button class="number" onclick="addToDisplay('0')"
                    style="grid-column: span 2;">0</button>

        </div>
    </div>


    <!-- SUBSCRIPTION -->
    <div class="subscription" id="subscription">

        <h1>🔒 Unlock Your Answer</h1>

        <p>
            Your calculation is ready!
            Subscribe to view the answer.
        </p>

        <div class="plan">
            <h2>Premium Calculator</h2>
            <p>Unlimited calculations</p>
            <h2>₱49 / Month</h2>

            <button class="subscribe-btn" onclick="subscribe()">
                Subscribe Now
            </button>
        </div>

        <button class="back-btn" onclick="goBack()">
            Back to Calculator
        </button>

        <div id="answer"></div>

    </div>


    <script>

        let calculation = "";

        function addToDisplay(value) {
            calculation += value;
            document.getElementById("display").value = calculation;
        }

        function clearDisplay() {
            calculation = "";
            document.getElementById("display").value = "";
        }

        function showSubscription() {

            if (calculation === "") {
                alert("Please enter a calculation first.");
                return;
            }

            document.getElementById("calculator").style.display = "none";
            document.getElementById("subscription").style.display = "block";
        }

        function subscribe() {

            try {

                let result = eval(calculation);

                document.getElementById("answer").innerHTML =
                    "Answer: " + result;

            } catch (error) {

                document.getElementById("answer").innerHTML =
                    "Invalid calculation.";

            }
        }

        function goBack() {

            document.getElementById("subscription").style.display = "none";
            document.getElementById("calculator").style.display = "block";

        }

    </script>

</body>
</html>
